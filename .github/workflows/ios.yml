# Builds an unsigned TamagotchIA.ipa on a macOS runner (same pattern as applebridge-probe).
# Signing happens on your side with your Apple ID (iBridge / iloader or Sideloadly).
# Like iSyCode Móvil: every push that touches the app (any branch) and every PR leaves the
# IPA as a workflow artifact. Nothing is published as a release from here.
name: iOS (IPA sin firmar)
on:
  workflow_dispatch:
  pull_request:
  push:
    paths: [ios/**, src/**, public/**, vendor/gus-runtime/**, package.json, package-lock.json, capacitor.config.ts, .github/workflows/ios.yml]
concurrency:
  group: ios-ipa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync ios
      - name: llama.cpp commit from VENDOR.json
        id: llama
        run: echo "commit=$(node -p "require('./vendor/gus-runtime/VENDOR.json').llama_cpp_commit")" >> "$GITHUB_OUTPUT"
      - name: Cache llama.xcframework
        id: xcf
        uses: actions/cache@v4
        with:
          path: vendor/gus-runtime/.build/llama
          key: llama-xcframework-${{ steps.llama.outputs.commit }}-v1
      - name: Build llama.xcframework with the vendored script (pinned commit)
        if: steps.xcf.outputs.cache-hit != 'true'
        run: bash vendor/gus-runtime/scripts/build-llama-xcframework.sh
      - name: Place llama.xcframework for the GusLocal package
        run: |
          rm -rf ios/App/GusLocal/llama.xcframework
          cp -R vendor/gus-runtime/.build/llama/llama.xcframework ios/App/GusLocal/llama.xcframework
          test -L ios/App/GusLocal/Sources/GUSBridge/GUSLlamaBridge.c || { echo "::error::bridge symlink lost"; exit 1; }
          cmp ios/App/GusLocal/Sources/GUSBridge/GUSLlamaBridge.c vendor/gus-runtime/Sources/Model/GUSLlamaBridge.c
      - name: Xcode version
        run: xcodebuild -version
      - name: Build unsigned
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/tama_dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build-output.log
      - name: Package IPA
        run: |
          APP=$(find /tmp/tama_dd/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -1)
          test -n "$APP" || { echo "::error::no .app produced"; exit 1; }
          test -f "$APP/Info.plist" && test -d "$APP/public" || { echo "::error::.app missing Info.plist or web assets"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :CFBundleShortVersionString" -c "Print :MinimumOSVersion" "$APP/Info.plist"
          mkdir -p out/Payload && cp -R "$APP" out/Payload/
          (cd out && zip -qry TamagotchIA-unsigned.ipa Payload)
          shasum -a 256 out/TamagotchIA-unsigned.ipa | tee out/SHA256SUMS
          ls -la out
      - name: The IPA carries the local brain, and no model weights
        run: |
          set -euo pipefail
          APP=$(find out/Payload -maxdepth 1 -name "*.app" -type d | head -1)
          if unzip -l out/TamagotchIA-unsigned.ipa | grep -i '\.gguf'; then
            echo "::error::Models are downloaded or imported in the app, never bundled."; exit 1
          fi
          test -d "$APP/Frameworks/llama.framework" || { echo "::error::llama.framework not embedded"; exit 1; }
          nm -gU "$APP/App" 2>/dev/null | grep -q "_gus_llama_generate_chat_sampled" || { echo "::error::the vendored bridge is not linked into the app"; exit 1; }
          grep -q "GusLocalPlugin" build-output.log || { echo "::error::GusLocalPlugin was not compiled"; exit 1; }
          {
            echo "### TamagotchIA-unsigned.ipa"
            echo "- Size: $(du -h out/TamagotchIA-unsigned.ipa | cut -f1)"
            echo "- SHA-256: \`$(cut -d' ' -f1 out/SHA256SUMS)\`"
            echo "- llama.cpp: \`${{ steps.llama.outputs.commit }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Unsigned: sign it with your Apple ID (Sideloadly / iloader). Running on an iPhone is NOT_DEMONSTRATED until someone does it."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: TamagotchIA-unsigned-ipa
          path: |
            out/TamagotchIA-unsigned.ipa
            out/SHA256SUMS
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-log
          path: build-output.log
          retention-days: 14
